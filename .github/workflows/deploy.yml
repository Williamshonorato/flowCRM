name: Deploy pra produção

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Atualizar código, dependências e banco no servidor
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            # O projeto é gerenciado pelo aaPanel como projeto Node/PM2, rodando sob o
            # usuário "www" (dono dos arquivos) com seu próprio daemon PM2 (PM2_HOME
            # separado do root) — por isso todo o deploy roda como www, não como root.
            sudo -u www bash -c "
              set -e
              cd \"${{ secrets.DEPLOY_PATH }}\"
              git fetch origin main
              git reset --hard origin/main
              export PATH=/www/server/nodejs/v24.19.0/bin:\$PATH
              npm install --omit=dev
              npx prisma generate
              # Sem --accept-data-loss de propósito: se uma mudança de schema arriscar
              # perder dados, o comando falha e o deploy para aqui, em vez de aplicar
              # sozinho. Nesse caso a migração precisa ser revisada manualmente.
              npx prisma db push
              PM2_HOME=/home/www/.pm2 pm2 restart flowcrm
            "
          '

      - name: Checar se subiu certo
        run: |
          sleep 3
          curl -sf https://flowcrm.seculo1.com/health || (echo "health check falhou depois do deploy" && exit 1)

      # Limpa o cache do Cloudflare pra que o frontend novo (HTML/JS servidos direto,
      # sem hash no nome) chegue nos navegadores na hora, em vez de esperar o TTL.
      # Precisa dos secrets CLOUDFLARE_ZONE_ID e CLOUDFLARE_API_TOKEN (token com a
      # permissão "Zone > Cache Purge" para a zona seculo1.com). Se não estiverem
      # configurados, o passo avisa e segue sem quebrar o deploy.
      - name: Limpar cache do Cloudflare
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE" ] || [ -z "$CF_TOKEN" ]; then
            echo "CLOUDFLARE_ZONE_ID / CLOUDFLARE_API_TOKEN não configurados — pulando purge do cache."
            exit 0
          fi
          resp=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true' || (echo "purge do Cloudflare falhou" && exit 1)
