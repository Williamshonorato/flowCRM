<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>FlowCRM — Conversas</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --green:#27ae60;--blue:#2980b9;--purple:#8e44ad;--amber:#f39c12;--red:#e74c3c;
      --sidebar:#0f172a;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--bg:#f1f5f9;
    }
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);display:flex;min-height:100vh}

    /* SIDEBAR */
    .sidebar{width:230px;min-height:100vh;background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0}
    .sb-brand{padding:20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.07)}
    .sb-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--green),#1abc9c);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px}
    .sb-name{font-size:17px;font-weight:800;color:#fff}.sb-name span{color:var(--green)}
    .sb-nav{flex:1;padding:14px 10px}
    .sb-section{font-size:10px;font-weight:700;color:#334155;letter-spacing:.8px;text-transform:uppercase;padding:10px 10px 6px}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:#94a3b8;cursor:pointer;text-decoration:none;transition:all .18s;margin-bottom:2px}
    .nav-item:hover{background:rgba(255,255,255,.06);color:#e2e8f0}
    .nav-item.active{background:linear-gradient(135deg,rgba(39,174,96,.18),rgba(26,188,156,.1));color:#4ade80;font-weight:700}
    .nav-item .ico{width:18px;text-align:center;font-size:15px}
    .nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:10px}
    .sb-bottom{padding:14px 10px;border-top:1px solid rgba(255,255,255,.07)}
    .user-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer}
    .user-row:hover{background:rgba(255,255,255,.06)}
    .user-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--green),#1abc9c);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
    .user-info .name{font-size:13px;font-weight:600;color:#e2e8f0}
    .user-info .plan{font-size:11px;color:#64748b}

    /* MAIN */
    .main{flex:1;display:flex;flex-direction:column;min-width:0}
    .topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:58px;display:flex;align-items:center;gap:12px;flex-shrink:0}
    .page-title{font-size:17px;font-weight:800;color:var(--text);flex:1}
    .wpp-status{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
    .wpp-on{background:#dcfce7;color:#166534}
    .wpp-off{background:#fee2e2;color:#991b1b}

    .body{display:flex;flex:1;overflow:hidden}

    /* CONVERSATION LIST */
    .conv-list{width:320px;background:#fff;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
    .conv-search{padding:14px 16px;border-bottom:1px solid var(--border)}
    .conv-search input{width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:var(--bg)}
    .conv-search input:focus{border-color:var(--green)}
    .conv-item{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
    .conv-item:hover{background:#f8fafc}
    .conv-item.active{background:#f0fdf4}
    .conv-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
    .conv-body{flex:1;min-width:0}
    .conv-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .conv-name{font-size:13.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .conv-time{font-size:11px;color:var(--muted);flex-shrink:0}
    .conv-preview{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
    .conv-snippet{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .conv-unread{background:var(--green);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px;flex-shrink:0}
    .conv-empty{padding:40px 20px;text-align:center;color:#94a3b8;font-size:13px}

    /* THREAD */
    .thread{flex:1;display:flex;flex-direction:column;min-width:0}
    .thread-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#94a3b8}
    .thread-empty .ico{font-size:40px}
    .thread-header{background:#fff;border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
    .thread-header .conv-avatar{width:38px;height:38px}
    .thread-header-name{font-size:14.5px;font-weight:800;color:var(--text)}
    .thread-header-sub{font-size:12px;color:var(--muted)}
    .th-btn{margin-left:auto;padding:7px 14px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer}
    .th-btn:hover{border-color:var(--green);color:var(--green)}

    .thread-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:#f8fafc}
    .msg-row{display:flex}
    .msg-row.out{justify-content:flex-end}
    .msg-bubble{max-width:60%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.45;position:relative}
    .msg-row.in .msg-bubble{background:#fff;border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px}
    .msg-row.out .msg-bubble{background:var(--green);color:#fff;border-bottom-right-radius:4px}
    .msg-time{font-size:10px;margin-top:4px;opacity:.7}
    .msg-sender{font-size:11px;font-weight:800;color:var(--purple);margin-bottom:3px}
    .msg-media img{max-width:240px;border-radius:10px;display:block;cursor:pointer}
    .msg-media audio{max-width:240px;display:block}
    .msg-media a{color:inherit;font-weight:700;text-decoration:underline}
    .msg-media{margin-bottom:4px}

    /* Selo de grupo no inbox e no cabeçalho da thread */
    .conv-tag{display:inline-block;font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:5px;background:#ede9fe;color:#6d28d9;margin-left:6px;vertical-align:middle}

    .thread-reply{background:#fff;border-top:1px solid var(--border);padding:14px 20px;flex-shrink:0;display:flex;gap:8px;align-items:flex-end}
    .thread-reply textarea{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:inherit;resize:none;outline:none;max-height:100px}
    .thread-reply textarea:focus{border-color:var(--green)}
    .reply-tool{width:40px;height:40px;flex-shrink:0;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .reply-tool:hover{border-color:var(--green)}
    .reply-tool.recording{background:#fee2e2;border-color:var(--red);animation:pulse 1s infinite}
    @keyframes pulse{50%{opacity:.55}}
    .reply-send{padding:0 20px;height:40px;border:none;border-radius:10px;background:var(--green);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;flex-shrink:0}
    .reply-send:hover{background:#219a52}
    .reply-send:disabled{opacity:.6;cursor:default}
    .rec-hint{font-size:12px;color:var(--red);font-weight:700;padding:0 8px;align-self:center}

    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:all .25s;z-index:100}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* PROFILE MODAL */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center}
    .overlay.open{display:flex}
    .modal{background:#fff;border-radius:20px;padding:28px;width:380px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.18)}
    .modal-close{float:right;width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:#fff;font-size:14px;cursor:pointer}
    .modal-close:hover{background:var(--bg)}
    .pm-avatar{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;margin:4px 0 14px}
    .pm-new-badge{display:inline-flex;align-items:center;gap:6px;background:#fff7ed;color:var(--amber);font-size:12px;font-weight:700;padding:6px 12px;border-radius:9px;margin-bottom:16px}
    .pm-g{margin-bottom:12px}
    .pm-g label{display:block;font-size:12px;font-weight:600;color:var(--text);margin-bottom:5px}
    .pm-g input,.pm-g select{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:13.5px;color:var(--text);outline:none;background:#fff}
    .pm-g input:focus,.pm-g select:focus{border-color:var(--green)}
    .pm-g input:disabled{background:var(--bg);color:var(--muted)}
    .pm-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .pm-actions{display:flex;gap:10px;margin-top:18px}
    .pm-save{flex:2;padding:11px;border:none;border-radius:9px;background:linear-gradient(135deg,var(--green),#1abc9c);font-size:13.5px;font-weight:700;color:#fff;cursor:pointer}
    .pm-save:disabled{opacity:.6;cursor:default}
    .pm-full{flex:1;padding:11px;border:1.5px solid var(--border);border-radius:9px;background:#fff;font-size:13px;font-weight:600;color:var(--text);cursor:pointer}
    .pm-full:hover{border-color:var(--green);color:var(--green)}
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sb-brand"><div class="sb-icon">⚡</div><div class="sb-name">Flow<span>CRM</span></div></div>
  <nav class="sb-nav">
    <div class="sb-section">Principal</div>
    <a class="nav-item" href="crm-dashboard.html"><span class="ico">📊</span>Dashboard</a>
    <a class="nav-item" href="crm-pipeline.html"><span class="ico">🗂️</span>Pipeline</a>
    <a class="nav-item" href="crm-contatos.html"><span class="ico">👥</span>Contatos</a>
    <a class="nav-item active" href="crm-conversas.html"><span class="ico">💬</span>Conversas<span class="badge" id="sbUnread" style="display:none">0</span></a>
    <a class="nav-item" href="crm-tarefas.html"><span class="ico">✅</span>Tarefas<span class="badge" data-fc="tasks-badge" style="display:none"></span></a>
    <div class="sb-section">Sistema</div>
    <a class="nav-item" href="crm-relatorios.html"><span class="ico">📈</span>Relatórios</a>
    <a class="nav-item" href="crm-automacoes.html"><span class="ico">🤖</span>Automações</a>
    <a class="nav-item" href="crm-integracoes.html"><span class="ico">🔌</span>Integrações</a>
    <a class="nav-item" href="crm-configuracoes.html"><span class="ico">⚙️</span>Configurações</a>
  </nav>
  <div class="sb-bottom">
    <div class="user-row">
      <div class="user-avatar" data-fc="user-avatar" id="userAvatar">–</div>
      <div class="user-info">
        <div class="name" data-fc="user-name" id="userName">–</div>
        <div class="plan" data-fc="user-plan" id="userPlan"></div>
      </div>
    </div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div class="page-title">Conversas</div>
    <span class="wpp-status wpp-off" id="wppStatusBadge">verificando...</span>
  </div>

  <div class="body">
    <div class="conv-list" id="convList">
      <div class="conv-search"><input type="text" placeholder="Buscar conversa..." oninput="filterConvs(this.value)"/></div>
      <div id="convItems"></div>
    </div>

    <div class="thread" id="threadArea">
      <div class="thread-empty" id="threadEmpty">
        <div class="ico">💬</div>
        <div>Selecione uma conversa pra ver as mensagens</div>
      </div>
    </div>
  </div>
</div>

<!-- PERFIL DO CONTATO -->
<div class="overlay" id="profileOverlay" onclick="if(event.target===this)closeProfileModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeProfileModal()">✕</button>
    <div class="pm-avatar" id="pm-avatar">?</div>
    <div id="pm-newBadge" class="pm-new-badge" style="display:none">🆕 Contato criado automaticamente pelo WhatsApp — complete os dados</div>

    <div class="pm-g"><label>Nome</label><input type="text" id="pm-name" placeholder="Nome do contato"/></div>
    <div class="pm-g"><label>Telefone</label><input type="text" id="pm-phone" disabled/></div>
    <div class="pm-g"><label>E-mail</label><input type="email" id="pm-email" placeholder="email@exemplo.com"/></div>
    <div class="pm-row2">

      <div class="pm-g"><label>Origem</label>
        <select id="pm-origin">
          <option value="whatsapp">WhatsApp</option><option value="indicacao">Indicação</option>
          <option value="instagram">Instagram</option><option value="google_ads">Google Ads</option><option value="outro">Outro</option>
        </select>
      </div>
    </div>
    <div class="pm-g"><label>Temperatura</label>
      <select id="pm-temp"><option value="new">🆕 Novo</option><option value="hot">🔥 Quente</option><option value="warm">🌡️ Morno</option><option value="cold">❄️ Frio</option></select>
    </div>

    <div class="pm-actions">
      <button class="pm-full" onclick="window.location.href='crm-contatos.html?contactId='+pmContactId">Ficha completa →</button>
      <button class="pm-save" id="pm-save-btn" onclick="saveProfile()">Salvar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="flowcrm-api.js"></script>
<script src="crm-sidebar.js"></script>
<script>
  authGuard();

  let conversations = [];
  let currentConv = null;   // contactId (conversa direta) ou chatJid (grupo)
  let currentChat = null;   // objeto da conversa aberta { type, contactId, chatJid, name }
  let searchText = '';

  const convKey = c => c.type === 'group' ? c.chatJid : c.contactId;

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  function fmtTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    return sameDay ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
                   : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  }

  async function checkWppStatus() {
    const stats = await api('/whatsapp/stats');
    const badge = document.getElementById('wppStatusBadge');
    if (stats?.connected) { badge.textContent = '✓ WhatsApp conectado'; badge.className = 'wpp-status wpp-on'; }
    else { badge.textContent = 'WhatsApp desconectado'; badge.className = 'wpp-status wpp-off'; }
  }

  async function loadConversations() {
    const data = await api('/whatsapp/conversations');
    conversations = data || [];
    renderConvList();
    const totalUnread = conversations.reduce((s, c) => s + c.unreadCount, 0);
    const badge = document.getElementById('sbUnread');
    if (totalUnread > 0) { badge.style.display = 'inline-block'; badge.textContent = totalUnread; }
    else badge.style.display = 'none';
  }

  function escapeHtml(s) { return String(s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }

  function renderConvList() {
    const box = document.getElementById('convItems');
    const filtered = conversations.filter(c => !searchText || (c.name || '').toLowerCase().includes(searchText));
    if (!filtered.length) {
      box.innerHTML = `<div class="conv-empty">${conversations.length ? 'Nenhuma conversa encontrada.' : 'Nenhuma conversa ainda. Quando alguém mandar mensagem no WhatsApp conectado, aparece aqui.'}</div>`;
      return;
    }
    box.innerHTML = filtered.map((c, i) => {
      const key = convKey(c);
      const snippet = c.lastMessage ? (c.lastMessage.direction === 'out' ? 'Você: ' : '') + c.lastMessage.body : '';
      return `
      <div class="conv-item ${currentConv === key ? 'active' : ''}" onclick='openConversation(${JSON.stringify(key)})'>
        <div class="conv-avatar" style="background:${c.isGroup ? '#8b5cf6' : palColor(i)}">${c.isGroup ? '👥' : initials(c.name)}</div>
        <div class="conv-body">
          <div class="conv-top"><div class="conv-name">${escapeHtml(c.name)}${c.isGroup ? '<span class="conv-tag">GRUPO</span>' : ''}</div><div class="conv-time">${c.lastMessage ? fmtTime(c.lastMessage.createdAt) : ''}</div></div>
          <div class="conv-preview">
            <div class="conv-snippet">${escapeHtml(snippet)}</div>
            ${c.unreadCount ? `<div class="conv-unread">${c.unreadCount}</div>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function filterConvs(v) { searchText = v.toLowerCase(); renderConvList(); }

  async function openConversation(key) {
    const conv = conversations.find(c => convKey(c) === key);
    const isGroup = conv ? conv.isGroup : String(key).endsWith('@g.us');
    currentConv = key;
    renderConvList();

    const data = isGroup
      ? await api('/whatsapp/groups/' + encodeURIComponent(key) + '/messages')
      : await api('/whatsapp/conversations/' + key + '/messages');
    if (!data) return;

    const area = document.getElementById('threadArea');
    if (data.type === 'group') {
      currentChat = { type: 'group', chatJid: data.group.jid, name: data.group.name };
      const parts = data.group.participants || [];
      const partLabel = parts.length ? parts.map(p => p.name).slice(0, 4).join(', ') + (parts.length > 4 ? ` +${parts.length - 4}` : '') : 'Nenhuma mensagem de participante ainda';
      area.innerHTML = `
        <div class="thread-header">
          <div class="conv-avatar" style="background:#8b5cf6">👥</div>
          <div><div class="thread-header-name">${escapeHtml(data.group.name)} <span class="conv-tag">GRUPO</span></div><div class="thread-header-sub">${parts.length} participante(s): ${escapeHtml(partLabel)}</div></div>
        </div>
        <div class="thread-messages" id="threadMessages"></div>
        ${replyBarHtml()}
      `;
    } else {
      currentChat = { type: 'direct', contactId: data.contact.id, name: data.contact.name };
      area.innerHTML = `
        <div class="thread-header">
          <div class="conv-avatar" style="background:${palColor(0)}">${initials(data.contact.name)}</div>
          <div><div class="thread-header-name">${escapeHtml(data.contact.name)}</div><div class="thread-header-sub">${escapeHtml(data.contact.phone || '')}</div></div>
          <button class="th-btn" onclick="openProfileModal('${data.contact.id}')">Ver ficha do contato</button>
        </div>
        <div class="thread-messages" id="threadMessages"></div>
        ${replyBarHtml()}
      `;
    }
    wireReplyBar();
    renderMessages(data.messages, data.type === 'group');
    loadConversations();
  }

  function replyBarHtml() {
    return `
      <div class="thread-reply">
        <input type="file" id="mediaInput" accept="image/*,audio/*,video/*,.pdf" style="display:none"/>
        <button class="reply-tool" id="attachBtn" title="Anexar imagem, áudio ou arquivo">📎</button>
        <button class="reply-tool" id="recBtn" title="Gravar áudio">🎤</button>
        <span class="rec-hint" id="recHint" style="display:none">gravando…</span>
        <textarea id="replyText" placeholder="Digite sua mensagem..." rows="1"></textarea>
        <button class="reply-send" id="replySendBtn">Enviar →</button>
      </div>`;
  }

  function wireReplyBar() {
    const ta = document.getElementById('replyText');
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); } });
    document.getElementById('replySendBtn').addEventListener('click', sendReply);
    document.getElementById('attachBtn').addEventListener('click', () => document.getElementById('mediaInput').click());
    document.getElementById('mediaInput').addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) sendMediaFile(file);
      e.target.value = '';
    });
    document.getElementById('recBtn').addEventListener('click', toggleRecording);
  }

  function targetPayload() {
    return currentChat.type === 'group'
      ? { chatJid: currentChat.chatJid }
      : { contactId: currentChat.contactId };
  }

  function renderMessages(messages, isGroup) {
    const box = document.getElementById('threadMessages');
    if (!box) return;
    box.innerHTML = messages.map(m => {
      let inner = '';
      if (m.mediaUrl && m.mediaType === 'image') inner += `<div class="msg-media"><img src="${m.mediaUrl}" onclick="window.open('${m.mediaUrl}')"/></div>`;
      else if (m.mediaUrl && m.mediaType === 'audio') inner += `<div class="msg-media"><audio controls src="${m.mediaUrl}"></audio></div>`;
      else if (m.mediaUrl && m.mediaType === 'video') inner += `<div class="msg-media"><video controls src="${m.mediaUrl}" style="max-width:240px;border-radius:10px"></video></div>`;
      else if (m.mediaUrl) inner += `<div class="msg-media"><a href="${m.mediaUrl}" target="_blank">📄 Abrir arquivo</a></div>`;
      const showCaption = m.body && !(m.mediaType && /^\[.+\]$/.test(m.body));
      if (showCaption || !m.mediaUrl) inner += escapeHtml(m.body);
      const sender = (isGroup && m.direction === 'in') ? `<div class="msg-sender">${escapeHtml(m.senderName || m.senderPhone || '')}</div>` : '';
      return `<div class="msg-row ${m.direction}"><div class="msg-bubble">${sender}${inner}<div class="msg-time">${fmtTime(m.createdAt)}</div></div></div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  }

  async function sendReply() {
    const textarea = document.getElementById('replyText');
    const message = textarea.value.trim();
    if (!message || !currentChat) return;
    const btn = document.getElementById('replySendBtn');
    btn.disabled = true;
    const result = await api('/whatsapp/send', { method: 'POST', body: JSON.stringify({ ...targetPayload(), message }) });
    btn.disabled = false;
    if (result) {
      textarea.value = '';
      showToast('Mensagem enviada.');
      openConversation(currentConv);
    }
  }

  async function sendMediaFile(file, label) {
    if (!currentChat) return;
    if (file.size > 16 * 1024 * 1024) { showToast('Arquivo muito grande (máx. 16 MB).'); return; }
    showToast((label || 'Enviando') + '…');
    const fd = new FormData();
    fd.append('file', file, file.name || 'audio.webm');
    const t = targetPayload();
    Object.entries(t).forEach(([k, v]) => fd.append(k, v));
    const token = (typeof getToken === 'function') ? getToken() : localStorage.getItem('flowcrm_token');
    let res;
    try {
      res = await fetch((typeof API_BASE !== 'undefined' ? API_BASE : '') + '/whatsapp/send-media', {
        method: 'POST',
        headers: token ? { Authorization: 'Bearer ' + token } : {},
        body: fd,
      });
    } catch { showToast('Falha de conexão ao enviar a mídia.'); return; }
    if (!res.ok) {
      const b = await res.json().catch(() => ({}));
      showToast(b.error || 'Não foi possível enviar a mídia.');
      return;
    }
    showToast('Enviado.');
    openConversation(currentConv);
  }

  // ── Gravação de áudio (nota de voz) ──────────────────────────────────────────
  let mediaRecorder = null, recChunks = [];
  async function toggleRecording() {
    const btn = document.getElementById('recBtn');
    const hint = document.getElementById('recHint');
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
      showToast('Não foi possível acessar o microfone.');
      return;
    }
    recChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      btn.classList.remove('recording'); hint.style.display = 'none';
      const blob = new Blob(recChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      if (blob.size > 800) {
        const ext = (blob.type.includes('ogg')) ? 'ogg' : 'webm';
        sendMediaFile(new File([blob], 'nota-de-voz.' + ext, { type: blob.type }), 'Enviando áudio');
      }
    };
    mediaRecorder.start();
    btn.classList.add('recording'); hint.style.display = 'inline';
  }

  let pmContactId = null;

  async function openProfileModal(contactId) {
    const contact = await api('/contacts/' + contactId);
    if (!contact) return;
    pmContactId = contactId;

    document.getElementById('pm-avatar').textContent = initials(contact.name);
    document.getElementById('pm-avatar').style.background = palColor(0);
    document.getElementById('pm-name').value = contact.name || '';
    document.getElementById('pm-phone').value = contact.phone || '';
    document.getElementById('pm-email').value = contact.email || '';
    document.getElementById('pm-company').value = contact.company || '';
    document.getElementById('pm-origin').value = contact.origin || 'whatsapp';
    document.getElementById('pm-temp').value = contact.temperature || 'new';

    // Contato criado automaticamente pelo webhook do WhatsApp tem só nome+telefone —
    // sem e-mail, empresa ou negócio nenhum ainda. Avisa e convida a completar o cadastro.
    const isMinimal = !contact.email && !contact.company && (!contact.deals || contact.deals.length === 0);
    document.getElementById('pm-newBadge').style.display = isMinimal ? 'flex' : 'none';

    document.getElementById('profileOverlay').classList.add('open');
  }
  function closeProfileModal() { document.getElementById('profileOverlay').classList.remove('open'); }

  async function saveProfile() {
    const name = document.getElementById('pm-name').value.trim();
    if (!name) { showToast('Informe o nome do contato.'); return; }
    const btn = document.getElementById('pm-save-btn');
    btn.disabled = true; btn.textContent = 'Salvando...';
    const result = await api('/contacts/' + pmContactId, { method: 'PATCH', body: JSON.stringify({
      name,
      email: document.getElementById('pm-email').value.trim() || null,
      company: document.getElementById('pm-company').value.trim() || null,
      origin: document.getElementById('pm-origin').value,
      temperature: document.getElementById('pm-temp').value,
    })});
    btn.disabled = false; btn.textContent = 'Salvar';
    if (result) {
      showToast('Contato atualizado.');
      document.getElementById('pm-newBadge').style.display = 'none';
      loadConversations();
      if (currentConv === pmContactId) openConversation(currentConv);
    }
  }

  checkWppStatus();
  loadConversations();
</script>
</body>
