<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FlowCRM — Painel da plataforma</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--purple:#8e44ad;--green:#27ae60;--red:#e74c3c;--amber:#f39c12;--bg:#f1f5f9;--border:#e2e8f0;--text:#1e293b;--muted:#64748b}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);min-height:100vh}
  .topbar{background:#0f172a;color:#fff;padding:16px 28px;display:flex;align-items:center;gap:12px}
  .topbar .badge{background:linear-gradient(135deg,var(--purple),#c084fc);font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px}
  .topbar .title{font-size:16px;font-weight:800;flex:1}
  .topbar .who{font-size:12.5px;color:#94a3b8}
  .topbar button{background:transparent;border:1px solid #334155;color:#cbd5e1;padding:7px 14px;border-radius:8px;font-size:12.5px;cursor:pointer;margin-left:12px}
  .topbar button:hover{border-color:#64748b;color:#fff}
  .content{padding:28px;max-width:1200px;margin:0 auto}
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
  .stat-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px}
  .stat-card .num{font-size:26px;font-weight:800;color:var(--text)}
  .stat-card .lbl{font-size:12px;color:var(--muted);margin-top:2px}
  .section-title{font-size:15px;font-weight:800;color:var(--text);margin:24px 0 12px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:12px 16px;background:#f8fafc;border-bottom:1px solid var(--border)}
  td{padding:14px 16px;font-size:13.5px;color:var(--text);border-bottom:1px solid var(--border)}
  tr:last-child td{border-bottom:none}
  .tname{font-weight:700}
  .tmeta{font-size:12px;color:var(--muted)}
  .badge-status{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .badge-active{background:#dcfce7;color:#166534}
  .badge-inactive{background:#fee2e2;color:#991b1b}
  .row-actions{display:flex;gap:6px}
  .btn-sm{padding:6px 12px;border-radius:7px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:700;cursor:pointer}
  .btn-sm:hover{border-color:#94a3b8}
  .btn-sm.primary{border-color:var(--purple);color:var(--purple)}
  .btn-sm.primary:hover{background:#f5f0fa}
  .btn-sm.danger{color:var(--red)}
  .btn-sm.danger:hover{border-color:var(--red);background:#fef2f2}
  .btn-purple{padding:9px 16px;border:none;border-radius:9px;background:linear-gradient(135deg,var(--purple),#c084fc);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
  .empty{padding:40px;text-align:center;color:#94a3b8;font-size:13px}
  #ownerOnly{display:none}
  .admin-form{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .admin-form input,.admin-form select{padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:100}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .stats-row{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .stat-card.accent{border-color:var(--purple);background:linear-gradient(135deg,#faf5ff,#fff)}
  .stat-card.warn .num{color:var(--red)}
  .money-cell .val{font-weight:700}
  .money-cell .due{font-size:11px;color:var(--muted);margin-top:2px}
  .money-cell .due.late{color:var(--red);font-weight:700}
  .badge-billing{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .billing-trial{background:#eff6ff;color:#1d4ed8}
  .billing-ok{background:#dcfce7;color:#166534}
  .billing-late{background:#fee2e2;color:#991b1b}
  .billing-canceled{background:#f1f5f9;color:#64748b}

  /* MODAL DE EDIÇÃO */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:18px;padding:28px;width:420px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .modal h3{font-size:16px;font-weight:800;color:var(--text);margin-bottom:18px}
  .modal .inp-g{margin-bottom:14px}
  .modal .inp-g label{display:block;font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:5px}
  .modal .inp-g input,.modal .inp-g select{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:13.5px;color:var(--text);outline:none;background:#fff}
  .modal .inp-g input:focus,.modal .inp-g select:focus{border-color:var(--purple)}
  .modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  .modal-cancel{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:9px;background:#fff;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
  .modal-save{flex:2;padding:10px;border:none;border-radius:9px;background:linear-gradient(135deg,var(--purple),#c084fc);font-size:13.5px;font-weight:700;color:#fff;cursor:pointer}
</style>
</head>
<body>

<div class="topbar">
  <div class="badge">🛡️ PLATAFORMA</div>
  <div class="title">FlowCRM — Painel administrativo</div>
  <div class="who" id="whoAmI"></div>
  <button onclick="logout()">Sair</button>
</div>

<div class="content">
  <div class="stats-row" id="statsRow"></div>

  <div class="section-title">Empresas cadastradas</div>
  <table>
    <thead>
      <tr><th>Empresa</th><th>Plano</th><th>Mensalidade</th><th>Cobrança</th><th>Usuários</th><th>Contatos</th><th>Status</th><th></th></tr>
    </thead>
    <tbody id="tenantsBody"></tbody>
  </table>

  <div id="ownerOnly">
    <div class="section-title">Admins da plataforma</div>
    <table>
      <thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th></th></tr></thead>
      <tbody id="adminsBody"></tbody>
    </table>
    <div class="admin-form">
      <input type="text" id="na-name" placeholder="Nome"/>
      <input type="email" id="na-email" placeholder="E-mail"/>
      <input type="password" id="na-pass" placeholder="Senha (mín. 6)"/>
      <select id="na-role"><option value="superadmin">superadmin</option><option value="owner">owner</option></select>
      <button class="btn-purple" onclick="createAdmin()">+ Adicionar admin</button>
    </div>
  </div>
</div>

<!-- EDITAR EMPRESA -->
<div class="overlay" id="editOverlay" onclick="if(event.target===this)closeEdit()">
  <div class="modal">
    <h3>✏️ Editar empresa</h3>
    <div class="inp-g"><label>Nome do negócio</label><input type="text" id="e-name"/></div>
    <div class="row2">
      <div class="inp-g"><label>Plano</label>
        <select id="e-plan">
          <option value="starter">Starter</option>
          <option value="professional">Profissional</option>
          <option value="connected">Connected</option>
          <option value="enterprise">Enterprise</option>
        </select>
      </div>
      <div class="inp-g"><label>Mensalidade (R$)</label><input type="number" id="e-value" min="0" step="0.01" placeholder="0,00"/></div>
    </div>
    <div class="row2">
      <div class="inp-g"><label>Status de cobrança</label>
        <select id="e-billing">
          <option value="trial">Trial</option>
          <option value="active">Ativa (cobrando)</option>
          <option value="canceled">Cancelada</option>
        </select>
      </div>
      <div class="inp-g"><label>Próximo vencimento</label><input type="date" id="e-due"/></div>
    </div>
    <div class="inp-g" style="margin-bottom:0"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="e-active" style="width:auto"/> Empresa ativa (login liberado)</label></div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeEdit()">Cancelar</button>
      <button class="modal-save" onclick="saveEdit()">Salvar alterações</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="flowcrm-api.js"></script>
<script>
  if (!authGuard()) { /* já redireciona */ }
  let mePromise = getMe();
  (async () => {
    const me = await mePromise;
    if (!me?.user?.platformRole) {
      apiToast('Essa área é restrita ao painel da plataforma.');
      window.location.href = 'crm-dashboard.html';
    }
  })();

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  let tenants = [];
  const PLAN_LABEL = (typeof PLAN_LABELS !== 'undefined') ? PLAN_LABELS
    : { starter: 'Starter', professional: 'Profissional', connected: 'Connected', enterprise: 'Enterprise' };
  const BILLING_LABEL = { trial: 'Trial', active: 'Em dia', canceled: 'Cancelada' };

  function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  async function loadTenants() {
    tenants = await api('/platform/tenants') || [];
    renderStats();
    renderTenants();
  }

  function renderStats() {
    const totalUsers = tenants.reduce((s, t) => s + t._count.users, 0);
    const totalContacts = tenants.reduce((s, t) => s + t._count.contacts, 0);
    const active = tenants.filter(t => t.active).length;
    const mrr = tenants.filter(t => t.billingStatus === 'active').reduce((s, t) => s + Number(t.monthlyValue || 0), 0);
    const overdue = tenants.filter(t => t.overdue).length;
    document.getElementById('statsRow').innerHTML = `
      <div class="stat-card"><div class="num">${tenants.length}</div><div class="lbl">Empresas cadastradas</div></div>
      <div class="stat-card"><div class="num">${active}</div><div class="lbl">Ativas</div></div>
      <div class="stat-card accent"><div class="num">${fmtMoney(mrr)}</div><div class="lbl">Receita mensal (MRR)</div></div>
      <div class="stat-card${overdue ? ' warn' : ''}"><div class="num">${overdue}</div><div class="lbl">Em atraso</div></div>
      <div class="stat-card"><div class="num">${totalUsers}</div><div class="lbl">Usuários no total</div></div>
      <div class="stat-card"><div class="num">${totalContacts}</div><div class="lbl">Contatos no total</div></div>
    `;
  }

  function billingBadge(t) {
    if (t.billingStatus === 'trial') return `<span class="badge-billing billing-trial">Trial</span>`;
    if (t.billingStatus === 'canceled') return `<span class="badge-billing billing-canceled">Cancelada</span>`;
    return t.overdue ? `<span class="badge-billing billing-late">Atrasado</span>` : `<span class="badge-billing billing-ok">Em dia</span>`;
  }

  function renderTenants() {
    const box = document.getElementById('tenantsBody');
    if (!tenants.length) { box.innerHTML = `<tr><td colspan="8"><div class="empty">Nenhuma empresa cadastrada ainda.</div></td></tr>`; return; }
    box.innerHTML = tenants.map(t => {
      const due = t.nextDueDate ? new Date(t.nextDueDate).toLocaleDateString('pt-BR') : null;
      return `
      <tr>
        <td><div class="tname">${esc(t.name)}</div><div class="tmeta">${esc(t.slug)}</div></td>
        <td>${PLAN_LABEL[t.plan] || t.plan}</td>
        <td class="money-cell">
          <div class="val">${fmtMoney(t.monthlyValue)}</div>
          ${due ? `<div class="due${t.overdue ? ' late' : ''}">vence ${due}</div>` : ''}
        </td>
        <td>${billingBadge(t)}</td>
        <td>${t._count.users}</td>
        <td>${t._count.contacts}</td>
        <td><span class="badge-status ${t.active ? 'badge-active' : 'badge-inactive'}">${t.active ? 'Ativa' : 'Suspensa'}</span></td>
        <td>
          <div class="row-actions">
            <button class="btn-sm primary" onclick="enterAsTenant('${t.id}')">Entrar como admin</button>
            <button class="btn-sm" onclick="openEdit('${t.id}')">Editar</button>
            <button class="btn-sm" onclick="toggleActive('${t.id}', ${!t.active})">${t.active ? 'Suspender' : 'Reativar'}</button>
            <button class="btn-sm danger" onclick="deleteTenant('${t.id}','${t.name.replace(/'/g, "\\'")}')">Excluir</button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  // ── EDITAR EMPRESA ───────────────────────────────────────────────────────────
  let editingId = null;
  function openEdit(id) {
    const t = tenants.find(x => x.id === id);
    if (!t) return;
    editingId = id;
    document.getElementById('e-name').value = t.name || '';
    document.getElementById('e-plan').value = t.plan || 'starter';
    document.getElementById('e-value').value = Number(t.monthlyValue || 0);
    document.getElementById('e-billing').value = t.billingStatus || 'trial';
    document.getElementById('e-due').value = t.nextDueDate ? t.nextDueDate.slice(0, 10) : '';
    document.getElementById('e-active').checked = !!t.active;
    document.getElementById('editOverlay').classList.add('open');
  }
  function closeEdit() { document.getElementById('editOverlay').classList.remove('open'); editingId = null; }

  async function saveEdit() {
    if (!editingId) return;
    const name = document.getElementById('e-name').value.trim();
    if (!name) { showToast('Informe o nome da empresa.'); return; }
    const body = {
      name,
      plan: document.getElementById('e-plan').value,
      monthlyValue: Number(document.getElementById('e-value').value) || 0,
      billingStatus: document.getElementById('e-billing').value,
      nextDueDate: document.getElementById('e-due').value || null,
      active: document.getElementById('e-active').checked,
    };
    const result = await api('/platform/tenants/' + editingId, { method: 'PATCH', body: JSON.stringify(body) });
    if (result) { showToast('Empresa atualizada.'); closeEdit(); loadTenants(); }
  }

  async function enterAsTenant(id) {
    const result = await api('/platform/tenants/' + id + '/impersonate', { method: 'POST' });
    if (result) startImpersonation(result.token, result.tenant.name);
  }

  async function toggleActive(id, active) {
    const result = await api('/platform/tenants/' + id, { method: 'PATCH', body: JSON.stringify({ active }) });
    if (result) { showToast(active ? 'Empresa reativada.' : 'Empresa suspensa.'); loadTenants(); }
  }

  async function deleteTenant(id, name) {
    if (prompt(`Isso apaga "${name}" e TODOS os dados dela pra sempre. Digite o nome da empresa pra confirmar:`) !== name) { showToast('Cancelado.'); return; }
    await api('/platform/tenants/' + id, { method: 'DELETE' });
    showToast('Empresa excluída.');
    loadTenants();
  }

  async function loadAdmins() {
    const me = await mePromise;
    if (me?.user?.platformRole !== 'owner') return;
    document.getElementById('ownerOnly').style.display = 'block';
    const admins = await api('/platform/admins') || [];
    document.getElementById('adminsBody').innerHTML = admins.map(a => `
      <tr>
        <td>${a.name}</td>
        <td>${a.email}</td>
        <td>${a.platformRole}</td>
        <td>${a.id === me?.user?.id ? '' : `<button class="btn-sm danger" onclick="deleteAdmin('${a.id}')">Remover</button>`}</td>
      </tr>
    `).join('');
  }

  async function createAdmin() {
    const name = document.getElementById('na-name').value.trim();
    const email = document.getElementById('na-email').value.trim();
    const password = document.getElementById('na-pass').value;
    const platformRole = document.getElementById('na-role').value;
    if (!name || !email || password.length < 6) { showToast('Preencha nome, e-mail e senha (mín. 6 caracteres).'); return; }
    const result = await api('/platform/admins', { method: 'POST', body: JSON.stringify({ name, email, password, platformRole }) });
    if (result) {
      showToast('Admin criado.');
      document.getElementById('na-name').value = '';
      document.getElementById('na-email').value = '';
      document.getElementById('na-pass').value = '';
      loadAdmins();
    }
  }

  async function deleteAdmin(id) {
    if (!confirm('Remover o acesso desse admin à plataforma?')) return;
    await api('/platform/admins/' + id, { method: 'DELETE' });
    showToast('Acesso removido.');
    loadAdmins();
  }

  (async function init() {
    const me = await mePromise;
    document.getElementById('whoAmI').textContent = me ? `${me.user.name} · ${me.user.platformRole}` : '';
  })();
  loadTenants();
  loadAdmins();
</script>
</body>
</html>
