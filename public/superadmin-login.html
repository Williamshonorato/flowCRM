<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FlowCRM — Painel da plataforma</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;border-radius:18px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,.35)}
  .badge{display:inline-flex;align-items:center;gap:6px;background:#1e293b;color:#94a3b8;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;margin-bottom:18px}
  h1{font-size:20px;font-weight:800;color:#1e293b;margin-bottom:6px}
  p.sub{font-size:13px;color:#64748b;margin-bottom:24px}
  label{display:block;font-size:12.5px;font-weight:600;color:#1e293b;margin-bottom:6px}
  input{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:9px;font-size:14px;outline:none;margin-bottom:16px}
  input:focus{border-color:#8e44ad}
  button{width:100%;padding:12px;border:none;border-radius:9px;background:linear-gradient(135deg,#8e44ad,#c084fc);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
  button:hover{opacity:.92}
  button:disabled{opacity:.6;cursor:default}
  #err{display:none;background:#fee2e2;color:#b91c1c;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px}
</style>
</head>
<body>
  <div class="card">
    <div class="badge">🛡️ ÁREA RESTRITA</div>
    <h1>Painel da plataforma</h1>
    <p class="sub">Acesso exclusivo pra administração do FlowCRM como um todo.</p>
    <div id="err"></div>
    <label>E-mail</label>
    <input id="email" type="email" placeholder="seu@email.com" autocomplete="username"/>
    <label>Senha</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"/>
    <button id="btn" onclick="doLogin()">Entrar</button>
  </div>

<script>
  const API_BASE = window.location.origin;

  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('err');
    const btn = document.getElementById('btn');
    errEl.style.display = 'none';
    if (!email || !password) { errEl.textContent = 'Preencha e-mail e senha.'; errEl.style.display = 'block'; return; }

    btn.disabled = true; btn.textContent = 'Entrando...';
    try {
      const res = await fetch(API_BASE + '/platform/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Erro ao entrar.'; errEl.style.display = 'block'; return; }
      localStorage.setItem('flowcrm_platform_token', data.token);
      localStorage.setItem('flowcrm_platform_admin', JSON.stringify(data.admin));
      window.location.href = 'superadmin-dashboard.html';
    } catch {
      errEl.textContent = 'Não foi possível conectar ao servidor.';
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  }
</script>
</body>
</html>
